name: Build and publish Strimzi

on:
  workflow_dispatch:
  push:
    branches:
      - release-0.25.x-k8s126
    paths:
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_ORG: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_TAG: 0.25.0-k8s126-r2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install yq v4
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Build Maven project
        run: |
          mvn -B clean install \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Ddependency.analyze.skip=true

      - name: Generate Kafka configuration models
        run: |
          cd config-model-generator
          ./build-config-models.sh build

      - name: Package cluster operator with generated models
        run: |
          mvn -B -pl cluster-operator -am package \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Ddependency.analyze.skip=true

      - name: Verify Kafka configuration models
        run: |
          set -euo pipefail
          JAR=cluster-operator/target/cluster-operator-0.25.0.jar
          test -s cluster-operator/target/cluster-operator-0.25.0-dist.zip

          for version in $(yq -r '.[] | select(.supported == true) | .version' kafka-versions.yaml); do
            model="kafka-${version}-config-model.json"
            test -s "cluster-operator/src/main/resources/${model}"
            jar tf "$JAR" | grep -Fx "$model"
          done

      - name: Build Docker images
        run: |
          cd docker-images
          make docker_build

      - name: Show images
        run: docker images

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images to Docker Hub
        run: |
          cd docker-images
          make docker_push
