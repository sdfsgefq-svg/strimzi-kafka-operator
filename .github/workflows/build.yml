
name: Build Strimzi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build Maven project
        run: |
          mvn -B clean install \
            -Dmaven.test.skip=true \
            -Dmaven.javadoc.skip=true

      - name: Build Docker images
        run: |
          cd docker-images
          make docker_build

      - name: Show images
        run: docker images
